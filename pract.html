<!DOCTYPE html>                  <!-- 1. HTML5 doctype -->
<html lang="en-US">              <!-- 2. Root element + language -->
  <head>                         <!-- 3. Head = metadata, CSS links -->
    <meta charset="utf-8">       <!-- character encoding -->
    <title>My first website</title>
    <style>
      /* example inline styles */
      body { text-align: center; background: #0f0f0f; }
      h1    { color: #a83333; }
      p   {color: #651dc2; }
    </style>
  </head>
  <body>                         <!-- 4. Body = visible content -->
    <h1>I love Python</h1>       <!-- semantic heading -->
    <p>Hello, world!</p>         <!-- paragraph -->

    <img
    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQEjcs8WMHlVuwDV4QdusGqQFwzkv7rGkZ8Dw&s"
    >
    </body>
</html>
